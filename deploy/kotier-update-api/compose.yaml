services:
  api:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "server.js"]
    ports:
      - "8781:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./server.js:/app/server.js:ro
      - ./data:/data
